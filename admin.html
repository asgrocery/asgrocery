
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AS Grocery Shop - Admin Login</title>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3e2418, #795238);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fffaf0;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            color: #4b2e20;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8a6a52;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #4b2e20;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8c2a8;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        input:focus {
            border-color: #a66a32;
            box-shadow: 0 0 0 3px rgba(166,106,50,0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #79502f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #4b2e20;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #79502f;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            color: #9a806b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="assets/Freshness%20%26%20Quality%20Grocery%20Badge%20(1).png"
            alt="AS Grocery Shop Logo"
            class="logo"
        >

        <h1>AS GROCERY SHOP</h1>
        <p class="subtitle">Administrator Login</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Admin Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn">
                Sign In
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

        <div class="footer">
            © 2026 AS Grocery Shop. All Rights Reserved.
        </div>

    </div>

    <script>

        // =====================================
        // SUPABASE PROJECT CONFIGURATION
        // =====================================

        const SUPABASE_URL =
            "https://okkcynqpfothwpbuzzcf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_IbeMrALRqariKvX1Z44n7g_dIqM0JuY";


        // =====================================
        // CONNECT TO SUPABASE
        // =====================================

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // =====================================
        // ADMIN LOGIN SYSTEM
        // =====================================

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const message =
                    document.getElementById("message");

                const button =
                    document.getElementById("loginBtn");

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                message.style.color = "#a33a2d";
                message.textContent = "";

                button.disabled = true;
                button.textContent = "Checking Login...";

                let loginSuccessful = false;

                try {

                    // STEP 1: SIGN IN

                    const { data, error } =
                        await db.auth.signInWithPassword({
                            email: email,
                            password: password
                        });

                    if (error) {
                        throw new Error(
                            "Login failed: " + error.message
                        );
                    }


                    // STEP 2: CHECK ADMIN PROFILE

                    const { data: profile, error: profileError } =
                        await db
                            .from("profiles")
                            .select("role")
                            .eq("id", data.user.id)
                            .maybeSingle();

                    if (profileError) {

                        await db.auth.signOut();

                        throw new Error(
                            "Profile error: " + profileError.message
                        );
                    }


                    // STEP 3: CHECK PROFILE EXISTS

                    if (!profile) {

                        await db.auth.signOut();

                        throw new Error(
                            "Admin profile not found. Please add your user UUID to the profiles table."
                        );
                    }


                    // STEP 4: CHECK ADMIN ROLE

                    if (profile.role !== "admin") {

                        await db.auth.signOut();

                        throw new Error(
                            "Access denied. Your account does not have admin permission."
                        );
                    }


                    // STEP 5: LOGIN SUCCESSFUL

                    loginSuccessful = true;

                    message.style.color = "green";

                    message.textContent =
                        "Login successful! Opening dashboard...";


                    // STEP 6: REDIRECT TO DASHBOARD

                    window.location.href = "admin-dashboard.html";

                }

                catch (error) {

                    console.error("Admin Login Error:", error);

                    message.style.color = "#a33a2d";

                    message.textContent = error.message;

                }

                finally {

                    if (!loginSuccessful) {

                        button.disabled = false;
                        button.textContent = "Sign In";

                    }

                }

            }
        );

    </script>

</body>
</html>
