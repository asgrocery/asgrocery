
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS Grocery Shop - Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: #faf6ef;
    color: #4b2e1e;
}

header {
    background: #4b2e1e;
    color: white;
    padding: 15px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
}

.logo h2 {
    font-size: 22px;
}

nav {
    display: flex;
    gap: 15px;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.cart-btn {
    background: #d6a15d;
    color: #3d281b;
    border: 0;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    background: linear-gradient(120deg, #ead5b8, #fff9ef);
    padding: 40px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.hero p {
    color: #806b58;
}

.search {
    text-align: center;
    padding: 25px 15px;
}

.search input {
    width: min(500px, 95%);
    padding: 14px;
    border: 1px solid #c9ad8b;
    border-radius: 8px;
    font-size: 16px;
}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 15px 30px;
}

.categories button {
    padding: 11px 20px;
    background: #ead5b8;
    border: 0;
    border-radius: 25px;
    color: #4b2e1e;
    cursor: pointer;
    font-weight: bold;
}

.categories button.active,
.categories button:hover {
    background: #6b4025;
    color: white;
}

.products-section {
    padding: 10px 6% 60px;
}

.section-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 30px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #00000012;
    transition: transform 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);
}

.product-image {
    height: 175px;
    background: #f2e7d7;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 70px;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 8px;
}

.category-label {
    font-size: 13px;
    color: #977b5d;
}

.description {
    color: #806b58;
    font-size: 13px;
    margin-top: 8px;
}

.price {
    font-size: 21px;
    font-weight: bold;
    color: #98612e;
    margin: 13px 0;
}

.stock-label {
    font-size: 13px;
    color: #806b58;
    margin-bottom: 10px;
}

.add-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    background: #6b4025;
    color: white;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #4b2e1e;
}

.add-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.empty-products {
    text-align: center;
    padding: 30px;
    grid-column: 1 / -1;
    color: #806b58;
}

.cart-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    width: min(430px, 100%);
    height: 100%;
    background: white;
    z-index: 100;
    box-shadow: -5px 0 20px #0003;
    padding: 22px;
    overflow-y: auto;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid #ead5b8;
    padding-bottom: 17px;
}

.close-btn {
    background: #ead5b8;
    border: 0;
    padding: 9px 13px;
    border-radius: 5px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #eee;
    padding: 16px 0;
}

.cart-item p {
    color: #98612e;
    font-weight: bold;
    margin-top: 7px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.quantity button {
    width: 27px;
    height: 27px;
    border: 0;
    background: #ead5b8;
    border-radius: 4px;
    cursor: pointer;
}

.remove-btn {
    background: #a33a2d;
    color: white;
    border: 0;
    padding: 7px;
    border-radius: 5px;
    cursor: pointer;
}

.cart-total {
    border-top: 2px solid #ead5b8;
    margin-top: 20px;
    padding-top: 18px;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}

.checkout {
    background: #6b4025;
    color: white;
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 7px;
    margin-top: 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.empty-cart {
    text-align: center;
    padding: 50px 10px;
    color: #806b58;
}

footer {
    background: #2e1c13;
    color: #ead5b8;
    padding: 25px;
    text-align: center;
}

@media(max-width:600px) {
    header {
        justify-content: center;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero h1 {
        font-size: 29px;
    }

    .products-section {
        padding: 10px 4% 40px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>
    <div class="logo">
        <h2>🛒 AS GROCERY SHOP</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </nav>
</header>

<!-- HERO SECTION -->

<section class="hero">
    <h1>Our Grocery Products 🛒</h1>
    <p>Fresh Products | Best Prices | Best Quality</p>
</section>

<!-- SEARCH -->

<div class="search">
    <input
        id="searchInput"
        placeholder="🔍 Search your favourite products..."
        oninput="renderProducts()"
    >
</div>

<!-- CATEGORIES -->

<div class="categories">
    <button class="active" onclick="setCategory('All',this)">
        All Products
    </button>

    <button onclick="setCategory('Vegetables',this)">
        🥦 Vegetables
    </button>

    <button onclick="setCategory('Fruits',this)">
        🍎 Fruits
    </button>

    <button onclick="setCategory('Groceries',this)">
        🌾 Groceries
    </button>

    <button onclick="setCategory('Dairy',this)">
        🥛 Dairy
    </button>

    <button onclick="setCategory('Other',this)">
        🛒 Other
    </button>
</div>

<!-- PRODUCTS -->

<section class="products-section">

    <h2 class="section-title">Explore Our Products</h2>

    <div class="product-grid" id="productGrid">
        <p class="empty-products">Loading products...</p>
    </div>

</section>

<!-- CART -->

<div class="cart-panel" id="cartPanel">

    <div class="cart-header">
        <h2>🛒 Your Cart</h2>

        <button class="close-btn" onclick="closeCart()">
            ✕
        </button>
    </div>

    <div id="cartItems"></div>

    <div id="cartFooter">

        <div class="cart-total">
            <span>Total:</span>
            <span id="cartTotal">₹0</span>
        </div>

        <button class="checkout" onclick="checkout()">
            Order via WhatsApp
        </button>

    </div>

</div>

<!-- FOOTER -->

<footer>
    <h2>AS GROCERY SHOP</h2>

    <p style="margin-top:10px">
        Freshness & Quality You Can Trust ❤️
    </p>

    <p style="margin-top:10px">
        © 2026 AS Grocery Shop. All Rights Reserved.
    </p>
</footer>

<script>

// ========================================
// SUPABASE CONFIGURATION
// ========================================

const SUPABASE_URL =
    "https://okkcynqpfothwpbuzzcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_IbeMrALRqariKvX1Z44n7g_dIqM0JuY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ========================================
// GLOBAL VARIABLES
// ========================================

let products = [];

let cart = JSON.parse(
    localStorage.getItem("asGroceryCart") || "[]"
);

let selectedCategory = "All";


// ========================================
// HTML SECURITY
// ========================================

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[c]));

}


// ========================================
// CATEGORY EMOJI
// ========================================

function emojiFor(category) {

    return {
        Vegetables: "🥦",
        Fruits: "🍎",
        Groceries: "🌾",
        Dairy: "🥛",
        Other: "🛒"
    }[category] || "🛒";

}


// ========================================
// LOAD PRODUCTS FROM SUPABASE
// ========================================

async function loadProducts() {

    const grid = document.getElementById("productGrid");

    grid.innerHTML =
        "<p class='empty-products'>Loading products...</p>";

    try {

        const { data, error } = await db
            .from("products")
            .select("id,name,description,price,category,stock,image_url,is_active")
            .eq("is_active", true)
            .order("id", { ascending: true });

        if (error) {
            throw error;
        }

        products = data || [];

        // Remove products from cart if they are no longer active

        cart = cart.filter(item =>
            products.some(p => Number(p.id) === Number(item.id))
        );

        saveCart();

        renderProducts();

        updateCart();

        if (products.length === 0) {
            grid.innerHTML = `
                <div class="empty-products">
                    <h3>No products available yet.</h3>
                    <p>Please check again later.</p>
                </div>
            `;
        }

    } catch (error) {

        console.error("Supabase Product Error:", error);

        grid.innerHTML = `
            <div class="empty-products">
                <h3>Unable to load products.</h3>
                <p>${escapeHTML(error.message)}</p>
                <button class="add-btn"
                    style="max-width:180px;margin-top:15px"
                    onclick="loadProducts()">
                    Try Again
                </button>
            </div>
        `;

    }

}


// ========================================
// DISPLAY PRODUCTS
// ========================================

function renderProducts() {

    const search = document
        .getElementById("searchInput")
        .value.toLowerCase()
        .trim();

    const filtered = products.filter(p =>

        String(p.name).toLowerCase().includes(search) &&

        (
            selectedCategory === "All" ||
            p.category === selectedCategory
        )

    );

    let html = "";

    filtered.forEach(p => {

        const image = p.image_url
            ? `
                <img
                    src="${escapeHTML(p.image_url)}"
                    alt="${escapeHTML(p.name)}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
                >
            `
            : "";

        html += `

            <div class="product-card">

                <div class="product-image">

                    ${image}

                    <span style="${p.image_url ? 'display:none' : ''}">
                        ${emojiFor(p.category)}
                    </span>

                </div>

                <div class="product-info">

                    <h3>${escapeHTML(p.name)}</h3>

                    <span class="category-label">
                        ${escapeHTML(p.category)}
                    </span>

                    ${p.description ? `
                        <p class="description">
                            ${escapeHTML(p.description)}
                        </p>
                    ` : ""}

                    <div class="price">
                        ₹${Number(p.price).toFixed(2)}
                    </div>

                    <div class="stock-label">
                        ${p.stock > 0
                            ? `Available: ${p.stock}`
                            : "Out of stock"}
                    </div>

                    <button
                        class="add-btn"
                        ${p.stock <= 0 ? "disabled" : ""}
                        onclick="addToCart(${Number(p.id)})"
                    >
                        ${p.stock > 0
                            ? "+ Add to Cart"
                            : "Out of Stock"}
                    </button>

                </div>

            </div>

        `;

    });

    document.getElementById("productGrid").innerHTML =
        html || "<p class='empty-products'>No products found.</p>";

}


// ========================================
// CATEGORY FILTER
// ========================================

function setCategory(category, button) {

    selectedCategory = category;

    document
        .querySelectorAll(".categories button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

}


// ========================================
// SAVE CART
// ========================================

function saveCart() {

    localStorage.setItem(
        "asGroceryCart",
        JSON.stringify(cart)
    );

}


// ========================================
// ADD TO CART
// ========================================

function addToCart(id) {

    const product = products.find(
        p => Number(p.id) === Number(id)
    );

    if (!product) return;

    const item = cart.find(
        p => Number(p.id) === Number(id)
    );

    const quantity = item ? item.quantity : 0;

    if (quantity >= product.stock) {

        alert("Sorry, available stock is only " + product.stock);

        return;

    }

    if (item) {

        item.quantity++;

    } else {

        cart.push({
            id: product.id,
            name: product.name,
            price: Number(product.price),
            quantity: 1
        });

    }

    saveCart();

    updateCart();

}


// ========================================
// CHANGE QUANTITY
// ========================================

function changeQuantity(id, amount) {

    const item = cart.find(
        p => Number(p.id) === Number(id)
    );

    const product = products.find(
        p => Number(p.id) === Number(id)
    );

    if (!item || !product) return;

    if (amount > 0 && item.quantity >= product.stock) {

        alert("Maximum available stock reached.");

        return;

    }

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart = cart.filter(
            p => Number(p.id) !== Number(id)
        );

    }

    saveCart();

    updateCart();

}


// ========================================
// REMOVE CART ITEM
// ========================================

function removeItem(id) {

    cart = cart.filter(
        p => Number(p.id) !== Number(id)
    );

    saveCart();

    updateCart();

}


// ========================================
// UPDATE CART DISPLAY
// ========================================

function updateCart() {

    document.getElementById("cartCount").textContent =
        cart.reduce((sum, p) => sum + p.quantity, 0);

    let html = "";

    if (cart.length === 0) {

        html = `
            <div class="empty-cart">
                <h2>🛒</h2>
                <h3>Your Cart is Empty!</h3>
                <p>Add some products to continue shopping.</p>
            </div>
        `;

    } else {

        cart.forEach(p => {

            html += `

                <div class="cart-item">

                    <div>

                        <h4>${escapeHTML(p.name)}</h4>

                        <p>
                            ₹${Number(p.price).toFixed(2)} × ${p.quantity}
                        </p>

                        <div class="quantity">

                            <button onclick="changeQuantity(${Number(p.id)},-1)">
                                −
                            </button>

                            <span>${p.quantity}</span>

                            <button onclick="changeQuantity(${Number(p.id)},1)">
                                +
                            </button>

                        </div>

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${Number(p.id)})"
                    >
                        Remove
                    </button>

                </div>

            `;

        });

    }

    document.getElementById("cartItems").innerHTML = html;

    const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity,
        0
    );

    document.getElementById("cartTotal").textContent =
        "₹" + total.toFixed(2);

    document.getElementById("cartFooter").style.display =
        cart.length ? "block" : "none";

}


// ========================================
// OPEN CART
// ========================================

function openCart() {

    updateCart();

    document.getElementById("cartPanel").style.display =
        "block";

}


// ========================================
// CLOSE CART
// ========================================

function closeCart() {

    document.getElementById("cartPanel").style.display =
        "none";

}


// ========================================
// WHATSAPP CHECKOUT
// ========================================

async function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;

    }

    // Verify current prices and stock

    const { data, error } = await db
        .from("products")
        .select("id,name,price,stock,is_active")
        .in("id", cart.map(p => p.id));

    if (error) {

        alert("Unable to verify product stock. Please try again.");

        console.error(error);

        return;

    }

    for (const item of cart) {

        const latest = data.find(
            p => Number(p.id) === Number(item.id)
        );

        if (
            !latest ||
            !latest.is_active ||
            latest.stock < item.quantity
        ) {

            alert(
                "Stock changed for " +
                item.name +
                ". Please update your cart."
            );

            await loadProducts();

            return;

        }

        item.name = latest.name;
        item.price = Number(latest.price);

    }

    saveCart();

    updateCart();

    const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity,
        0
    );

    let message =
        "Hello AS Grocery Shop! I want to order:\n\n";

    cart.forEach(p => {

        message +=
            `${p.name} - ${p.quantity} x ₹${p.price} = ₹${p.price * p.quantity}\n`;

    });

    message +=
        `\nTotal Amount: ₹${total.toFixed(2)}\n\nPlease confirm my order.`;

    const whatsappURL =
        "https://wa.me/918682880430?text=" +
        encodeURIComponent(message);

    window.open(whatsappURL, "_blank");

}


// ========================================
// START SHOP PAGE
// ========================================

updateCart();

loadProducts();

</script>

</body>
</html>
